    max_height: 82vh
    top_radius: 14px
- id: secondary-metadata-line
  status: frozen
  format: A · B · C
  rules:
  - descriptive_only
  - not_a_chip
  - middle_dot_with_spaces
  - same_semantics_same_visual_grammar
- id: current-state-motion
  status: frozen
  allowed_on:
  - continue-learning
  rules:
  - signal_family_only
  - border_only
  - period_7_to_9_seconds
  - no_outer_glow
  - no_shadow
  - no_multicolor_neon
  - reduced_motion_off
  - static_hairline_fallback
- id: technical-diagram
  status: frozen
  anatomy:
  - header
  - canvas
  - caption
  rules:
  - mobile_first_390
  - same_component_responsive
  - no_raster_text
  - no_default_shadow
  - figcaption_required
  - color_not_only_semantic
  - diagram_directive_from_markdown
  - header_title_only_no_type_badge
  - mobile_density_compact
  - embedded_in_surface_flattens_outer_frame
  - caption_preferred_over_extra_callout
  - split_if_single_concept_becomes_too_tall
  - not_default_learning_surface
  - simple_linear_relation_prefers_text
  - must_reduce_cognitive_load
  - must_not_omit_key_constraints
