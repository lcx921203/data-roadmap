  - default_collapsed
  - one_open_at_a_time
  - curated_extension_not_frequency_claim
  - canonical_question_can_link_internally
  - pending_answer_labeled
  - no_runtime_ai
  - whole_row_is_click_target
  - indicator_is_quiet_no_circle
- id: code-block
  status: frozen
  rules:
  - only_for_code_config_command_sql
  - long_code_collapsible
  - horizontal_scroll
  - copy_action
  - inline_block_style_separation
- id: bottom-sheet
  status: frozen
  accessibility:
  - aria_modal
  - focus_trap
  - escape_close
  - restore_focus
