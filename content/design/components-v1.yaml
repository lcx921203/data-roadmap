  - one_pixel_border
  - ten_pixel_radius
  - short_subtitle_optional
  - semantic_palette_diagram_only
  - mobile_primary_height_52_to_56
  - mobile_compact_height_48_to_52
  - semantic_color_stable_within_domain
- id: diagram-arrow
  status: frozen
  rules:
  - thin_hairline
  - label_optional
  - direction_must_be_unambiguous
  - directional_relation_requires_arrowhead
  - mobile_gap_30_to_34
- id: diagram-branch
  status: frozen
  rules:
  - mobile_max_two_visible_columns
  - one_to_many_must_be_visually_explicit
  - ellipsis_allowed_for_repetition
  - directional_fork_requires_arrowheads
  - fork_means_one_to_many
- id: diagram-relation-grammar
  status: frozen
  relations:
    solid_arrow: reference_call_flow_sequence
    forked_arrow: one_to_many_reference_or_split
    dashed_arrow: retry_rollback_optional
    bracket_no_arrow: grouping_containment_only
  rules:
  - line_style_must_express_meaning
  - directional_relationship_has_arrowhead
  - color_not_required_to_understand_relation
