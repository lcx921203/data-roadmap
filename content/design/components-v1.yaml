  height: 844
principles:
  row_over_card: true
  single_accent: true
  default_shadow: none
  body_min_px: 16
  tap_target_min_px: 44
  evidence_visible: true
  dynamic_counts_from_content: true
  runtime_ai_answers: false
  interview_scale_is_not_top_level_scale: true
  motion_is_stateful_not_decorative: true
  descriptive_metadata_uses_middle_dot: true
  technical_diagrams_mobile_first: true
  diagram_text_is_real_dom_text: true
  diagram_relation_is_semantic: true
  embedded_diagram_avoids_nested_card: true
  diagram_palette_stable_within_domain: true
  content_correctness_first: true
  knowledge_structure_before_visualization: true
  diagram_is_optional_secondary: true
components:
- id: app-shell
  status: frozen
  anatomy:
  - top_bar
  - content
  - bottom_navigation
- id: continue-learning
  status: frozen
  rules:
  - whole_surface_clickable
  - signal_soft_current_state
  - signal_family_hairline
  - no_separate_cta
  - dynamic_position
  - position_not_completion
  - signal_border_moving_highlight_allowed
  - motion_period_7_to_9_seconds
  - border_only_no_outer_glow
  - reduced_motion_static_fallback
- id: question-row
  status: frozen
  rules:
  - question_is_primary
  - evidence_visible
  - dynamic_counts
- id: evidence-disclosure
  status: frozen
  mobile_container: bottom_sheet
  grouping: company
  sorting:
  - company_record_count_desc
  - records_published_at_desc
  backstage_only_fields:
  - source_url
  - reliability_grade
  - mapping_type
  - independence_group
  - review_status
- id: scale-followup-section
  status: frozen
  frontstage_title: 规模追问
  scope: current_interview_question_only
  rules:
  - not_top_level_scale_lab
  - text_fence_renders_as_semantic_rows
