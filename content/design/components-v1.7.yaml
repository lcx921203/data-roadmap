version: '1.7.1'
frozen_at: 0.6.7.1.1
status: active
viewport_baseline:
  width: 390
  height: 844

principles:
  row_over_card: true
  single_accent: true
  default_shadow: none
  body_min_px: 16
  tap_target_min_px: 44
  mobile_first: true
  evidence_visible: true
  runtime_ai_answers: false
  content_correctness_first: true
  three_public_tabs_only: true
  same_tab_continuation_before_cross_tab: true
  descriptive_metadata_uses_middle_dot: true
  horizontal_quick_nav_for_long_reading: false
  reading_directory_for_long_reading: true
  one_hand_reading_controls: true
  contextual_relations_before_end_blocks: true

components:
- id: app-shell
  status: active
  anatomy:
  - top_bar
  - content
  - bottom_navigation

- id: bottom-navigation
  status: active
  tabs:
  - learn
  - interview
  - scale
  rules:
  - raised_surface
  - strong_hairline_top_boundary
  - no_heavy_shadow
  - safe_area_inside_navigation
  - active_signal_only
  - quiet_two_pixel_active_indicator_allowed
  - content_has_extra_breathing_space

- id: reading-floating-control
  status: active_v1_7_1
  side: right
  behavior:
  - vertically_draggable
  - remembers_vertical_position
  - toggles_directory
  rules:
  - edge_docked
  - no_heavy_shadow
  - touch_action_none
  - remains_thumb_reachable
  - does_not_depend_on_top_bar

- id: reading-side-drawer
  status: active_v1_7_1
  side: right
  width_mobile: 86vw
  close_methods:
  - tap_scrim
  - swipe_right
  - floating_control_toggle
  - bottom_close_action
  - escape_key
  anatomy:
  - title
  - reading_progress
  - current_section
  - section_tree
  - bottom_close_action
  rules:
  - no_item_dividers
  - hierarchy_by_indent_spacing_type
  - active_uses_signal_soft
  - h2_h3_supported
  - focus_trap
  - restore_focus

- id: contextual-relation
  status: active_v1_7_1
  source_scope:
  - knowledge_section
  - scale_detail_item
  - interview_header
  targets:
  - learn
  - scale
  - interview
  rules:
  - place_near_relevant_context
  - compact_text_link_not_card
  - relation_is_not_frequency_claim
  - relation_is_not_project_fact
  - no_forced_relation_for_graph_completeness
  - explicit_section_mapping_is_single_source_of_truth

- id: secondary-metadata-line
  status: active
  format: A · B · C
  rules:
  - descriptive_only
  - not_a_chip
  - same_semantics_same_visual_grammar

- id: reading-segment
  status: active
  labels:
  - 面试回答
  - 深入理解
  rules:
  - local_reading_mode_not_top_level_navigation

- id: code-block
  status: active
  rules:
  - only_for_code_config_command_sql
  - horizontal_scroll
  - copy_action

- id: technical-diagram
  status: active
  usage_policy: exception_only_when_text_is_less_clear
  rules:
  - mobile_first_390
  - real_dom_text
  - no_default_shadow
  - figcaption_required
  - color_not_only_semantic
  - simple_linear_relation_prefers_text
  - must_reduce_cognitive_load
