nodes:
- order: 1
  id: kb-trino-overview-001
  title: Trino Overview & System Mental Model
  title_cn: Trino 总览与核心心智模型
  responsibility: '建立 Trino 是分布式 SQL Query Engine 而不是存储系统/数据库的核心心智模型， 串起 Client → Coordinator → Connector → Worker → Result
    的全链路。

    '
  prerequisites: []
  must_explain:
  - what_trino_is_and_is_not
  - federated_query_engine_positioning
  - coordinator_worker_connector_high_level_chain
  - interactive_query_engine_strengths_and_boundaries
