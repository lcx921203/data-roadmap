  - connector_spi_details
  - optimizer_rules
  - stage_task_split_runtime_details
  - iceberg_metadata_tree
  - resource_group_configuration
  handoff_to: kb-trino-query-lifecycle-001
  stage_order: 12
- order: 2
  id: kb-trino-query-lifecycle-001
  title: Coordinator, Worker & Query Lifecycle
  title_cn: Coordinator、Worker 与 Query Lifecycle
  responsibility: '解释 SQL 从提交到完成的生命周期，以及 Coordinator 与 Worker 的职责边界， 为后面的 Planning 与 Execution 建立运行骨架。

    '
  prerequisites:
  - kb-trino-overview-001
  must_explain:
