  responsibility: '解释 Statistics 如何影响 Cost-Based Optimizer，进而影响 Join Order、 Build / Probe、Broadcast / Partitioned Join，以及
    Dynamic Filtering 如何反向减少 Scan。

    '
  prerequisites:
  - kb-trino-scan-pushdown-001
  must_explain:
