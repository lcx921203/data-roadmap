  responsibility: '回答 Trino 自己不存数据时如何访问 Iceberg、Hive、MySQL 等外部系统， 明确 Catalog、Connector 与 SPI 在 Metadata、Statistics、Split 和读写能力中的边界。

    '
  prerequisites:
  - kb-trino-query-lifecycle-001
  must_explain:
