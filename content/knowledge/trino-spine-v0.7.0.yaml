  title_cn: Fault-Tolerant Execution 与失败恢复
  responsibility: '解释 Query Retry 与 Task Retry、Exchange Manager、中间结果持久化和 Worker Failure 的恢复边界，并区分交互式低延迟模式与更重的容错执行模式。

