id: sc-trino-interactive-concurrency-001
type: scenario
title: Protect interactive Trino SLO while BI and batch workloads share one cluster
title_cn: 150 个 BI 查询与 Batch 共用 Trino
domain: lakehouse
scenario_type:
  - system_design
  - concurrency
  - capacity
  - troubleshooting
difficulty: senior
hypothetical: true
scale_dimensions:
  - concurrency
  - latency
  - throughput
  - reliability
  - cost
status: scale_detail_v1
order: 4

summary: 高峰期 150 个交互查询与重型 Batch 同时进入同一 Trino Cluster，要求保护 BI P95，同时不能让 Batch 永久饿死。

display_tags:
  - 高并发
  - Resource Group
  - 查询 SLO
  - 负载隔离

quick_answer: >-
  不要把“150 并发”直接翻译成“加 Worker”。先把 Interactive 与 Batch 分类，
  用 Resource Group 控制运行并发、Queue 和扫描预算，再观察真正的饱和点。
  如果两类 Workload 的延迟、资源和故障模型差异过大，逻辑隔离不够时再拆独立 Cluster。

parameters:
  - label: BI 峰值
    value: 150 个并发交互查询
  - label: BI 目标
    value: 端到端 P95 ≤ 5 秒
  - label: Batch
    value: 同时存在 6 条重型分析任务，每条扫描约 0.5–2 TB
  - label: Trino Cluster
    value: 30 个 Worker，共享 Iceberg 与对象存储
  - label: 训练重点
    value: Admission、Queue、Resource Group、SLO、容量与成本

constraints:
  - title: 单 Query 很快不代表集群能承受高并发
    body: >-
      单独运行时 2 秒的查询，在 150 并发下会叠加 CPU、Memory、Network、Split 和对象存储请求。
      设计必须从 Workload 总压力出发，而不是用单条 SQL 的性能推断 Cluster Capacity。
  - title: BI 和 Batch 的目标函数不同
    body: >-
      BI 更在意 P95 和等待体验，Batch 更在意完成时间和吞吐。
      如果两类 Query 使用完全相同的并发、Queue 和优先级规则，少量重型任务就可能长期占住资源。
  - title: 不是所有低延迟 Serving 都应该压给 Trino
    body: >-
      如果场景需要极高 QPS、固定毫秒级点查或强 Serving SLA，
      应重新评估 Doris、ClickHouse、缓存或专用 Serving 层，而不是把所有请求都解释成 Trino 调参问题。

failure_bottlenecks:
  - title: 并发失控形成正反馈
    body: >-
      Query 越多，每条 Query 获得的有效 CPU / Memory / Network 越少，执行时间变长以后重叠时间又进一步增加，
      最终出现 P95、Queue 和失败率同时上升。
  - title: Batch 抢占 Interactive Headroom
    body: >-
      大型 Join、Sort 或 Scan 会持续占用 Worker Memory、Exchange 带宽和对象存储吞吐，
      导致本来很轻的 BI Query 也进入 Blocked 或长时间 Queue。
  - title: 只看 Running Time 会误判瓶颈
    body: >-
      如果 Execution 仍是 3 秒但 Queue 已经增长到 20 秒，
      真正问题是 Admission / Capacity，不是 SQL 执行本身突然变慢。

design:
  - title: 用 Resource Group 先做准入隔离
    body: >-
      将 BI、Ad-hoc 和 Batch 分到独立 Resource Group，分别设置并发上限和 Queue，
      让新 Query 在资源不足时等待，而不是无限进入 Running。
  - title: 让资源策略跟 Workload 类型匹配
    body: >-
      BI 重点保护短查询延迟；Batch 允许更少的并发和更长执行时间。
      对探索型 Query 可以额外限制 Physical Data Scan，避免误扫全表侵占共享资源。
  - title: 用压测找 Saturation Point
    body: >-
      按 20、50、100、150 等并发逐级增加压力，同时观察 Throughput、P95、Queue、Memory 和 Network。
      找到“并发继续上升但吞吐不再增长”的区域，再反推安全并发和 Headroom。
  - title: 必要时拆分 Interactive 与 Batch Cluster
    body: >-
      Resource Group 是逻辑治理，不是物理隔离。如果 Batch 的 Memory、Network、FTE 或维护窗口长期影响 BI，
      应评估两个独立 Trino Cluster 共享同一湖仓数据，而不是无限增加规则复杂度。

tradeoffs:
  - title: 更严格的并发限制保护 P95，但增加 Queue
    body: >-
      降低 Running Query 数可以减少资源争用，却会让更多请求等待。
      最终要以端到端 SLO 和系统吞吐共同校准，而不是追求 Queue 永远为零。
  - title: 独立 Cluster 隔离更强，但提高成本和运维复杂度
    body: >-
      物理隔离能减少资源互扰，却需要额外 Coordinator / Worker、部署、升级和容量预算。
      当逻辑隔离已经满足 SLO 时，没有必要为了“架构漂亮”强行拆集群。

observability:
  - title: 把 Queue Time 和 Execution Time 分开
    body: >-
      端到端延迟必须至少拆成 Queue、Planning 和 Execution。
      Queue 上升但 Execution 稳定时，优先定位 Resource Group 与 Capacity。
  - title: 同时看 Running Query 和资源饱和度
    body: >-
      观察 Running / Queued Query、Cluster Free Memory、CPU、Network、Worker Task 分布以及对象存储吞吐，
      判断当前是 Admission 限制还是底层资源真的饱和。
  - title: 按 Workload 分开看 SLO
    body: >-
      BI P95、Batch Completion Time 和 Ad-hoc Failure Rate 应分开统计，
      否则一个平均延迟会掩盖完全不同的用户体验。

cost:
  - title: Headroom 本身就是成本
    body: >-
      为保护峰值和 Worker Failure，需要保留未被常态 Workload 吃满的 CPU、Memory 和 Network。
      过度追求高利用率会直接压缩 SLO 缓冲。
  - title: 拆 Cluster 用更多固定资源换更确定的隔离
    body: >-
      独立 Cluster 增加基础资源成本，但可以降低复杂 Resource Group 规则和跨 Workload 干扰带来的隐性成本。

recovery:
  - title: 高峰降级优先限制新 Batch
    body: >-
      当 BI P95、Queue 或 Cluster Memory 越过保护线时，优先收紧 Batch Admission，
      而不是让已经拥塞的 Cluster 继续接受更多重型 Query。
  - title: 容量恢复后逐步放量
    body: >-
      不要一次性把 Queue 中所有 Batch 同时释放。按并发梯度恢复，确认 P95 和资源水位稳定后再扩大。

