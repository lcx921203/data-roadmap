id: sc-trino-fte-batch-recovery-001
type: scenario
title: Keep a 90-minute Trino batch query from restarting from zero after worker loss
title_cn: 90 分钟 Batch Query 的 Worker 故障恢复
domain: lakehouse
scenario_type:
  - reliability
  - system_design
  - recovery
difficulty: senior
hypothetical: true
scale_dimensions:
  - duration
  - reliability
  - recovery
  - cost
status: scale_detail_v1
order: 6

summary: 一条 90 分钟的大型 Batch Query 在弹性 Worker 环境中偶发节点丢失，目标是在控制额外 I/O 成本的前提下减少整条 Query 从头重跑。

display_tags:
  - FTE
  - TASK Retry
  - Exchange Manager
  - Recovery

quick_answer: >-
  先确认失败确实属于瞬时 Worker / Task Failure，再选择 Recovery Granularity。
  短 Query 可以接受 NONE / QUERY 的低开销模型；长 Batch 才考虑 TASK Retry，
  并把 Exchange Manager、Task Size、Retry 上限、Exchange Storage 容量与 Connector 支持一起设计。

parameters:
  - label: Query 时长
    value: 正常约 90 分钟
  - label: 数据规模
    value: 多表 Join 与聚合，总输入约 30 TB
  - label: Cluster
    value: 40 个弹性 Worker
  - label: 故障假设
    value: 运行窗口内可能出现 1–2 次瞬时 Worker Loss
  - label: 目标
    value: 单节点故障不导致整条 90 分钟 Query 从零重跑

constraints:
  - title: Retry 只应该处理瞬时失败
    body: >-
      SQL 错误、权限错误、坏 Plan 或单 Task 永远超出节点资源都不是 Retry 能解决的问题。
      先分类 Failure Domain，再决定是否进入 FTE。
  - title: TASK Retry 需要可恢复的中间输入
    body: >-
      如果上游 Exchange Output 只存在于瞬时 Network Pipeline，
      下游 Task 失败后就无法只重做局部工作，因此需要 Exchange Manager 保存可复用的中间结果。
  - title: FTE 支持存在 Connector 与 Statement 边界
    body: >-
      不能假设所有 Connector 和所有语句拥有完全相同的 Retry 能力。
      生产启用前必须核对当前 Trino 版本和目标 Workload 的支持范围。

failure_bottlenecks:
  - title: QUERY Retry 把 80 分钟已完成工作全部作废
    body: >-
      如果 Worker 在接近完成时失败，整条 Query Retry 会重新扫描和计算此前的全部数据，
      恢复时间和对象存储成本都可能接近再跑一遍。
  - title: TASK 太大会放大重试半径
    body: >-
      单个 Task 覆盖的数据越多，失败后需要重做的工作越大，
      甚至可能让一个 Task 本身超出 Worker 的资源承载能力。
  - title: Exchange Storage 自己也可能成为瓶颈
    body: >-
      TASK FTE 把更多 Intermediate Data 写入可恢复存储，
      如果带宽、请求能力或生命周期策略不足，Recovery 机制本身会反过来拖慢正常执行。

design:
  - title: TASK Retry 必须和 Exchange Manager 一起设计
    body: >-
      对长 Batch Query 使用 TASK Retry 时，将 Stage Exchange Output 持久化到可恢复 Storage，
      让失败 Task 能在新 Worker 上重新读取输入，而不是要求所有上游 Stage 重跑。
  - title: 用 Task Size 控制恢复粒度
    body: >-
      Task 太大增加失败重做成本，太小又增加 Scheduling、Metadata 和大量小 Exchange Object 开销。
      应以 Worker Resource 和目标恢复时间共同校准。
  - title: Retry 必须有上限和 Backoff
    body: >-
      对瞬时 Worker Failure 可以重试，但同一失败点持续出现时必须停止无限循环，
      进入故障诊断，而不是把 Retry 当作隐藏错误的机制。
  - title: Interactive 与 Batch 可以采用不同 Recovery 模型
    body: >-
      TASK Retry 更适合重型长 Query；大量短 Query 更在意低开销和低延迟。
      如果两类 Workload 长期冲突，可以用不同 Resource Group，必要时进一步拆独立 Cluster。

tradeoffs:
  - title: 更细粒度恢复减少重算，却增加 Exchange I/O
    body: >-
      TASK Retry 保存更多中间结果，降低 Worker Loss 的重算半径，
      但会增加 Object Storage / Filesystem I/O、Network 和 Storage Cost。
  - title: 更强可靠性可能牺牲短查询延迟
    body: >-
      对几秒钟的 Query，额外 Spooling 和 Coordination 可能比直接失败后重试整条 Query 更贵，
      因此 Recovery Policy 必须匹配 Workload。

observability:
  - title: Retry 成功率和 Exchange Storage 压力
    body: >-
      观察 Query / Task Retry 次数、同一 Task 重复失败、Exchange Write / Read Throughput、
      Storage Error 和额外恢复时间，判断 FTE 是否真的缩短了恢复。
  - title: 区分 Worker Loss 与 Deterministic Failure
    body: >-
      如果不同 Worker 上同一个 Task 每次在相同位置失败，应该停止把问题归类成瞬时节点故障，
      转而检查 Plan、Data、Connector 或 Resource Requirement。
  - title: 用恢复时间而不是“是否自动重试”评价 FTE
    body: >-
      自动 Retry 并不代表可靠性设计成功。真正要看失败后额外完成时间、重算数据量和 SLO 是否仍然满足。

cost:
  - title: Exchange Storage 成本成为运行时成本
    body: >-
      中间结果需要额外写入和读取，因此对象存储容量、请求和数据传输都必须进入 Batch Query 的成本模型。
  - title: 可靠性和吞吐之间需要预算
    body: >-
      如果为了极低失败率保存过多中间状态，正常情况下也可能长期付出 I/O 成本。
      需要根据 Worker Failure Rate 与 Query Value 决定容错级别。

recovery:
  - title: Worker Loss 后只恢复缺失 Task
    body: >-
      在 TASK Retry 模式下，新 Worker 读取已保存的 Exchange Input，
      重新执行失败 Task，让已经完成的上游工作继续被复用。
  - title: Exchange Manager 故障要有独立处置
    body: >-
      当可恢复 Storage 本身不可用时，Task Retry 的基础条件被破坏。
      需要把 Exchange Storage 当作生产依赖监控，并有容量、权限和生命周期保护。
  - title: 确定性失败应停止重试
    body: >-
      当错误不是 Transient Failure 时，应退出 Retry Loop，保留诊断信息，
      修复根因后再重新提交 Query。

