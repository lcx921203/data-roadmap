name: Bootstrap uploaded package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract package
        run: |
          unzip -o data-roadmap-v0.1-foundation.zip
          rm data-roadmap-v0.1-foundation.zip

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "chore: initialize DataRoadmap product and content foundation"
          git push
