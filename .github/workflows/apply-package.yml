name: Apply DataRoadmap package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract package
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name 'data-roadmap-*.zip' | sort | tail -n 1)"

          if [ -z "${ZIP}" ]; then
            echo "No DataRoadmap package found."
            exit 1
          fi

          echo "Applying ${ZIP}"

          unzip -o "${ZIP}" -x '.github/workflows/*'
          rm "${ZIP}"

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: apply DataRoadmap update"
          git push
